# Static deploy of AlgaeWatch Iceland. Build the site first:  python src/export_static.py
# then deploy from this folder:  npx netlify-cli deploy --dir site [--prod]
[build]
  publish = "site"

[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
